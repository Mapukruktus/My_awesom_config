# --- 1. Window & Pane Indexing ---
# Start numbering at 1 (more intuitive for Alt+1, Alt+2)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
# Split panes using | and - (optional but common) or v and h
bind v split-window -h
unbind '"'
unbind %
bind h select-pane -L
bind l select-pane -R
bind j select-pane -U
bind k select-pane -D

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind V split-window -v -c "#{pane_current_path}"
bind-key X kill-window
bind-key x kill-pane
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"
bind-key -n C-f run-shell "tmux new-window ~/.config/tmux/tmux-sessionizer"
set -g mouse on
# Status bar background and foreground
set -g status-style bg=default,fg=colour245

# Left side (Session name)
set -g status-left "#[fg=colour240,bg=default] #S  "

# Right side (Date and Time)
set -g status-right "#[fg=colour240,bg=default] %H:%M #[fg=colour240,bg=default] %d-%b-%y "

# Window tabs
setw -g window-status-format "#[fg=colour240,bg=default] #I:#W "
setw -g window-status-current-format "#[fg=colour255,bg=default,bold] #I:#W "

# Pane borders
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour240

# Alt-s / Alt-S: cycle sessions forward/backward
bind-key -n M-s switch-client -n
bind-key -n M-S switch-client -p
bind-key -n M-k run-shell "tmux new-window ~/.config/tmux/tmux-sessionizer kill"

# QOL bindings
bind-key -n M-n run-shell "tmux new-window opencode"      # Alt-o: opencode
bind-key -n M-r command-prompt -I "#S" "rename-session -- '%%'"   # Alt-r: rename session

# ── Plugins (TPM) ──────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore & auto-save
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

run '~/.config/tmux/plugins/tpm/tpm'

