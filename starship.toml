# Reset layout
add_newline = true
format = """
$directory\
$git_branch\
$python\
$line_break\
$character
"""

[line_break]
disabled = false
#   (Octocat)
#
# 󰊤  (GitHub Logo)
#
#   (Classic Git Branch)
#
# 󰊢  (Git Logo)
#
# 󱓞  (Network nodes)
#
#   (Git Commit/Node)
#
# 󰘬  (Geometric Branch)
#
#   (Flaming/Action icon) 
#
#   (Python/Snake - surprisingly popular for git)
#
# 󱙨  (Ghost)
#
# 󰚌  (Rocket)
#
# 󰄛  (Cat head)
#
# 󱗆  (Ninja/Mask)
#
# 󰭦  (Satellite)
#
# 󿚭  (Alien)
#
# 󿓀  (Portal/Vortex)
#
# 󱗑  (Planet)
[cmd_duration]
disabled = true

[directory]
style = "fg:#b4befe" 
format = "[$path]($style) "
truncation_length = 1
[git_branch]
symbol = " "
style = "fg:#94e2d5" 
format = "[$symbol\\[$branch\\]]($style) "

[python]
symbol = " "
style = "fg:#f9e2af"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[character]
success_symbol = "[❯](fg:#a6e3a1)" 
error_symbol = "[❯](fg:#f38ba8)"
